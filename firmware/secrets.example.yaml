# Add these to the ESPHome dashboard's Secrets (or, for a local CLI build, to a
# git-ignored secrets.yaml next to this file).

# The Thread dataset TLV: a long hex string starting with 0e. It contains the network key.
# With an Apple border router, HA only knows the key after the iPhone companion app sends it
# (Settings → Connectivity → Thread → "Send credentials to Home Assistant" at the bottom of
# the page; not "Send credentials to phone", which goes the other way). The UI doesn't
# show the TLV (only for HA's own OTBR), so read it in the browser console on that network's
# ⓘ page, using its "Dataset" value:
#   await document.querySelector("home-assistant").hass.callWS({type: "thread/get_dataset_tlv", dataset_id: "<Dataset>"})
thread_tlv: "0e08..."

# 32 random bytes, base64: `openssl rand -base64 32`. Also encrypts OTA updates.
api_encryption_key: "..."
